version: 2.1

orbs:
  snyk: snyk/snyk@2.0.3

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-deps-{{ checksum "requirements.txt" }}
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - save_cache:
          paths:
            - venv
          key: pip-deps-{{ checksum "requirements.txt" }}
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            pytest tests/ -v --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

  security-scan:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-deps-{{ checksum "requirements.txt" }}
      - run:
          name: Prepare Python environment for Snyk
          command: |
            python -m venv venv
            . venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt
            echo 'export PATH="$PWD/venv/bin:$PATH"' >> "$BASH_ENV"
      - snyk/scan:
          fail-on-issues: false
          monitor-on-build: true
          additional-arguments: "--file=requirements.txt --package-manager=pip --command=python3"

workflows:
  build-test-scan:
    jobs:
      - build-and-test
      # Make sure scanning waits until the build/cache step finishes successfully
      - security-scan:
          requires:
            - build-and-test
