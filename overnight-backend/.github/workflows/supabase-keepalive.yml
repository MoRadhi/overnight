name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at 08:00 UTC — safely under Supabase's 7-day pause threshold.
    - cron: "0 8 */5 * *"
  workflow_dispatch: # Allow triggering manually from the Actions tab

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest

    steps:
      - name: Send keep-alive request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase project to prevent inactivity pause..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "✓ Supabase is alive."
          else
            echo "✗ Unexpected status $STATUS — check project status at supabase.com"
            exit 1
          fi
