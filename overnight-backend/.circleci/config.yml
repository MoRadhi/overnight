version: 2.1

orbs:
  snyk: snyk/snyk@2.0.3

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
      - run:
          name: Resolve dependencies
          command: mvn dependency:go-offline -B
      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}
      - run:
          name: Build and run tests
          command: mvn -B clean verify
      - store_test_results:
          path: target/surefire-reports

  security-scan:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - snyk/scan:
          fail-on-issues: false
          monitor-on-build: true

workflows:
  build-test-scan:
    jobs:
      - build-and-test
      - security-scan
