spring:
  application:
    name: overnight-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/overnight}
    username: ${DB_USERNAME:overnight}
    password: ${DB_PASSWORD:overnight}
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

overnight:
  analytics:
    base-url: ${ANALYTICS_SERVICE_URL:http://localhost:8000}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-min-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
